<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECCR Reading Apps</title>
    <style>
      :root {
        color: #1f2b25;
        background: #eef3ef;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(760px, 100%);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }

      .mark {
        width: 72px;
        height: 46px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #2f7d4c;
        color: white;
        font-weight: 850;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        margin: 4px 0 0;
        color: #24633d;
        font-size: 13px;
        font-weight: 760;
        text-transform: uppercase;
      }

      .links {
        display: grid;
        gap: 12px;
      }

      a {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border: 1px solid #dfe7e1;
        border-radius: 8px;
        background: white;
        color: inherit;
        text-decoration: none;
        box-shadow: 0 10px 30px rgba(33, 45, 39, 0.1);
      }

      strong {
        display: block;
        font-size: 18px;
      }

      span {
        color: #66736c;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="mark">ECCR</div>
        <div>
          <h1>ECCR Reading Apps</h1>
          <p>Produced by Team Kairos</p>
        </div>
      </div>
      <div class="links">
        <a href="./picturebook/">
          <strong>Picture Book Reader</strong>
          <span>Touch text on the book page</span>
        </a>
        <a href="./audio/">
          <strong>Audio Practice</strong>
          <span>Listen from a sentence list</span>
        </a>
      </div>
    </main>
  </body>
</html>
