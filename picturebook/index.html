<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECCR Picture Book</title>
    <meta name="theme-color" content="#2f7d4c" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="stylesheet" href="style.css?v=20260904-offline-book3-1" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">ECCR</div>
          <div>
            <h1>Picture Book Reader</h1>
            <p>Produced by Team Kairos</p>
          </div>
        </div>
        <div class="book-tools">
          <label>
            <span>Book</span>
            <select id="bookSelect"></select>
          </label>
          <label>
            <span>English voice</span>
            <select id="englishVoiceSelect"></select>
          </label>
          <label>
            <span>Twi voice</span>
            <select id="twiVoiceSelect"></select>
          </label>
          <span id="statusPill" class="status-pill">Kokoro Fable</span>
        </div>
      </header>

      <section class="reader-stage" aria-label="Picture book page">
        <button id="prevBtn" class="page-turn left" type="button" aria-label="Previous page">
          <i data-lucide="chevron-left" aria-hidden="true"></i>
        </button>
        <div class="page-frame">
          <img id="pageImage" alt="" />
          <div id="hotspotLayer" class="hotspot-layer"></div>
        </div>
        <button id="nextBtn" class="page-turn right" type="button" aria-label="Next page">
          <i data-lucide="chevron-right" aria-hidden="true"></i>
        </button>
      </section>

      <footer class="page-nav">
        <div class="page-nav-head">
          <strong id="pageTitle">Page 1</strong>
          <span id="pageCounter">1 / 8</span>
        </div>
        <div id="pageDots" class="page-dots" aria-label="Pages"></div>
      </footer>

      <audio id="ttsAudio" playsinline></audio>
    </main>

    <script src="../shared/config.js?v=20260904-offline-book3-1"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="a4_books.js?v=20260904-offline-book3-1"></script>
    <script src="app.js?v=20260904-offline-book3-1"></script>
    <script src="../pwa.js?v=20260904-offline-book3-1"></script>
  </body>
</html>
